# XEN Training Engine v1 - tuned for an RTX 4060 8GB + 32GB system
model: XEN-from-scratch
vocab_size: 260
max_seq_len: 512
d_model: 512
n_heads: 8
n_layers: 12
ffn_mult: 2.6666666667
dropout: 0.0
rope_theta: 10000.0
epochs: 3
learning_rate: 0.0003
weight_decay: 0.1
warmup_steps: 200
batch_size: 2
gradient_accumulation: 8
max_grad_norm: 1.0
validation_split: 0.02
log_every: 20
save_every: 500
seed: 42
